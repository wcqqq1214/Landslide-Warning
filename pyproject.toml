[project]
name = "landslide-warning"
version = "0.1.0"
description = "Reproducible landslide displacement forecasting and warning pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "ngboost>=0.5.10",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "shap>=0.49.1",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E7", "E9", "F"]
