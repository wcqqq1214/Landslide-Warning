   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(32.515988 80.328669)">1461 日 × 8 测点</text>
