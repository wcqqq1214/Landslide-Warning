   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202428" x="21.0105" y="24.33096" transform="rotate(-0 21.0105 24.33096)">藕塘案例：当前自动预测与预警流程</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #60676d" x="21.0105" y="40.03434" transform="rotate(-0 21.0105 40.03434)">目标是让系统按时序自动给出多测点的未来状态概率和预警信号；不需要人工逐时判级。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202428" x="84.308625" y="73.303359" transform="rotate(-0 84.308625 73.303359)">数据与运动学</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(57.395813 85.445618)">1461 日 × 8 测点</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(42.852375 93.933068)">按真实 Δt 算速度和加速度</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202428" x="237.144825" y="73.303359" transform="rotate(-0 237.144825 73.303359)">ConvLSTM 概率位移预测</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(188.9262 85.478637)">全部 8 点输出 P10 / P50 / P90</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(197.94195 93.932675)">用 PICP 和区间宽度评价</text>
   </g>
   <g id="text_7">
    <!-- 当前时刻四项指标 $X_t$ -->
    <g style="fill: #202428" transform="translate(347.339025 73.832359)">
     <text>
      <tspan x="0" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">当</tspan>
      <tspan x="9.25" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">前</tspan>
      <tspan x="18.5" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">时</tspan>
      <tspan x="27.75" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">刻</tspan>
      <tspan x="37" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">四</tspan>
      <tspan x="46.25" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">项</tspan>
      <tspan x="55.5" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">指</tspan>
      <tspan x="64.75" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">标</tspan>
      <tspan x="74" y="-0.34375" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428"> </tspan>
      <tspan x="76.569946" y="-0.34375" style="font-style: oblique; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #202428">X</tspan>
      <tspan x="82.906738" y="1.132812" style="font-style: oblique; font-size: 6.44px; font-family: 'DejaVu Sans'; fill: #202428">t</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(343.181025 85.15295)">区间位置、速度、严格加速度</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(346.781025 94.275237)">改进切线角；只用当时信息</text>
   </g>
   <g id="text_9">
    <!-- 自动未来状态 $Y_{auto}$ -->
    <g style="fill: #202428" transform="translate(77.433125 144.372259)">
     <text>
      <tspan x="0" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">自</tspan>
      <tspan x="9.25" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">动</tspan>
      <tspan x="18.5" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">未</tspan>
      <tspan x="27.75" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">来</tspan>
      <tspan x="37" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">状</tspan>
      <tspan x="46.25" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428">态</tspan>
      <tspan x="55.5" y="-0.328125" style="font-size: 9.2px; font-family: 'Arial Unicode MS'; fill: #202428"> </tspan>
      <tspan x="58.069946" y="-0.328125" style="font-style: oblique; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #202428">Y</tspan>
      <tspan x="63.720215" y="1.148438" style="font-style: oblique; font-size: 6.44px; font-family: 'DejaVu Sans'; fill: #202428">a</tspan>
      <tspan x="67.688049" y="1.148438" style="font-style: oblique; font-size: 6.44px; font-family: 'DejaVu Sans'; fill: #202428">u</tspan>
      <tspan x="71.791833" y="1.148438" style="font-style: oblique; font-size: 6.44px; font-family: 'DejaVu Sans'; fill: #202428">t</tspan>
      <tspan x="74.330615" y="1.148438" style="font-style: oblique; font-size: 6.44px; font-family: 'DejaVu Sans'; fill: #202428">o</tspan>
     </text>
    </g>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(76.028062 152.788488)">以 t 后 H=7 天的多点变形</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(80.533125 161.274419)">自动生成五类代理结局</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202428" x="261.543375" y="143.797259" transform="rotate(-0 261.543375 143.797259)">五分类 site NGBoost</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(225.142875 152.864763)">输出绿/蓝/黄/橙/红概率</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(221.943375 161.265644)">与简单因果基线同步比较</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202428" x="399.648375" y="143.818103" transform="rotate(-0 399.648375 143.818103)">逐时输出</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(370.3455 152.734601)">测点级 + 滑坡体级</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(367.248375 161.293432)">五级概率和综合判定</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202428" x="136.098" y="197.160199" transform="rotate(-0 136.098 197.160199)">NGBoost SHAP</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(82.098 202.67201)">解释五分类模型怎样使用四项指标</text>
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(78.498 211.776073)">识别候选主控因素，不当作因果证明</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #416b8f" x="225.86625" y="181.36476" transform="rotate(-0 225.86625 181.36476)">模型解释</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.8px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #60676d" x="350.16075" y="179.93718" transform="rotate(-0 350.16075 179.93718)">暖启动或缺输入会明确标记</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5f8c62" x="27.91575" y="244.625191" transform="rotate(-0 27.91575 244.625191)">当前结论</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202428" x="76.2525" y="244.063668" transform="rotate(-0 76.2525 244.063668)">流程已跑通：全测点预测、四项指标、自动标签、五分类预警、SHAP 和逐时输出都有可复核产物。</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #d7832f" x="27.91575" y="270.316163" transform="rotate(-0 27.91575 270.316163)">结果边界</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202428" x="76.2525" y="269.956397" transform="rotate(-0 76.2525 269.956397)">ConvLSTM 和 NGBoost 目前都没有稳定超过简单基线；这是试跑结论，不能当作正式预警效果。</text>
   </g>
  </g>
 </g>
