   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202428" x="19.2528" y="23.30532" transform="rotate(-0 19.2528 23.30532)">藕塘案例当前技术链与证据边界</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #60676d" x="19.2528" y="35.9595" transform="rotate(-0 19.2528 35.9595)">从 8 个测点的物化日序列出发，分别完成概率预测/状态审计与独立模型依赖分析。</text>
   </g>
   <g id="text_3">
