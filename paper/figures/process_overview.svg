    <text style="font-size: 7.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #202428" transform="translate(124.401938 88.720437)">ΔV 审计 / 水位 / 雨量</text>
   </g>
   <g id="text_7">
