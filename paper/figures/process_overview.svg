   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #60676d" x="25.2792" y="223.753492" transform="rotate(-0 25.2792 223.753492)">证据门禁</text>
